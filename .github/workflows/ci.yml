name: CI - Test PRs & Main

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Types, lint, formatting, tests, and content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test -- --runInBand
      - run: npm run validate:data
      - run: npm run content:review
      - name: Verify manifests and checked-in review inventory
        run: git diff --exit-code -- package.json package-lock.json docs/editorial/content-review.json

  native-validation:
    name: ${{ matrix.platform }} project generation and JS bundle
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [ios, android]
    env:
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx expo prebuild --platform ${{ matrix.platform }} --no-install
      - run: npx expo export --platform ${{ matrix.platform }} --output-dir dist/${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-javascript-bundle
          path: dist/${{ matrix.platform }}
          retention-days: 7
      - name: State validation boundary
        run: echo 'Native project generation and production JS bundling passed. Native compilation, signing, and device testing are separate checks.'

  summary:
    name: Validation results
    if: always()
    runs-on: ubuntu-latest
    needs: [quality, native-validation]
    steps:
      - name: Report actual job outcomes
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          NATIVE_RESULT: ${{ needs.native-validation.result }}
        run: |
          {
            echo '## Validation results'
            echo ''
            echo '| Check | Result |'
            echo '| --- | --- |'
            echo "| Types, lint, formatting, Jest, content | $QUALITY_RESULT |"
            echo "| iOS/Android project generation and JS bundles | $NATIVE_RESULT |"
            echo ''
            echo 'Native compilation, signing, physical-device QA, and editorial acceptance are not established by these checks.'
          } >> "$GITHUB_STEP_SUMMARY"
          test "$QUALITY_RESULT" = success && test "$NATIVE_RESULT" = success
